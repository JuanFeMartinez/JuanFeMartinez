<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6eeda" />

    <title>Juan Felipe Martínez Villate — Dirección de arte y diseño de personajes</title>
    <meta
      name="description"
      content="Dirección de arte, diseño de personajes y motion graphics. Cómics, videojuegos y marcas."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Juan Felipe Martínez Villate — Dirección de arte y diseño de personajes" />
    <meta
      property="og:description"
      content="Cómics, videojuegos y marcas: personajes, ilustración y motion graphics."
    />

    <!-- La tarjeta que se ve al compartir el enlace en LinkedIn, WhatsApp o
         donde sea. Las direcciones tienen que ser absolutas porque las redes
         leen la etiqueta desde su propio servidor y una ruta relativa no les
         dice nada. __SITIO__ lo rellena Vite en cada build con la dirección
         real que le pasa el workflow: así esto se adapta solo si el
         repositorio cambia de nombre, en vez de quedarse apuntando a la
         dirección vieja. -->
    <meta property="og:url" content="__SITIO__/" />
    <meta property="og:image" content="__SITIO__/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Portafolio de Juan Felipe Martínez Villate" />
    <meta property="og:locale" content="es_CO" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SITIO__/og.jpg" />

    <!-- El avatar sobre el azul de la tinta. El relleno de la cara es crema, y
         eso es lo que hace que a 16 píxeles siga leyéndose como una silueta y
         no como una mancha: sobre un fondo claro se perdería.
         El de 180 va sin esquinas redondeadas a propósito, porque iOS le
         aplica las suyas y redondear dos veces deja un borde sucio. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icono-32.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="/icono-180.png" />
    <link rel="apple-touch-icon" href="/icono-180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400..900&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Solo los diez digitos: se usa unicamente para numerar los capitulos,
         asi que pedir la familia entera seria descargar de mas. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&text=0123456789&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
