# Publica el sitio en GitHub Pages en cada push a main.
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos pushes seguidos, que gane el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configurar Pages
        id: pages
        # Sin enablement: el token de Actions no tiene permisos para crear el
        # sitio de Pages. Hay que activarlo una vez a mano en
        # Settings -> Pages -> Source: GitHub Actions.
        uses: actions/configure-pages@v5

      - name: Construir
        run: npm run build
        env:
          # Esto vale "/" en un sitio de usuario y "/nombre-del-repo" en uno de
          # proyecto: así el mismo código sirve en cualquiera de los dos.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
