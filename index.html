    <!-- La tarjeta que se ve al compartir el enlace en LinkedIn, WhatsApp o
         donde sea. Las direcciones tienen que ser absolutas porque las redes
         leen la etiqueta desde su propio servidor y una ruta relativa no les
         dice nada. __SITIO__ lo rellena Vite en cada build con la dirección
         real que le pasa el workflow: así esto se adapta solo si el
         repositorio cambia de nombre, en vez de quedarse apuntando a la
         dirección vieja. -->
